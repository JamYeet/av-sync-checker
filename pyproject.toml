[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "avsync"
version = "0.1.0"
description = "Detect audio-visual offset in talking-head videos using SyncNet"
requires-python = ">=3.10"

[project.scripts]
avsync = "avsync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]